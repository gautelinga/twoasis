[pytest]
# Slow tests (convergence and refinement studies, a run of every problem; about
# 4 minutes) are excluded by default. Run them with `pytest -m slow`, or
# everything with `pytest -m "slow or not slow"`, from this folder.
addopts = -m "not slow"
markers =
    slow: convergence and refinement studies and smoke runs; enable with `pytest -m slow`
