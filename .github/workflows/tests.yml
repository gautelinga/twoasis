name: tests

# Legacy dolfin 2019.2 from the FEniCS PPA, installed with apt on the Ubuntu 24.04
# runner -- the same setup as the development machine and as stokes-beadpack's CI.
# Everything else comes from apt too, so h5py uses dolfin's (parallel) HDF5, NumPy
# is the one dolfin was built against, and mpirun is Ubuntu's Open MPI.
#
# The fast tests run on every push and pull request. The slow tests (temporal
# convergence, a smoke run of every problem) run weekly and on demand from the
# Actions tab.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

# A new push or PR update cancels the previous run of the same kind; the weekly
# and manual (slow) runs are in their own group, so a push does not cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "1"
      TWOASIS_REQUIRE_MPI: "1"  # fail, rather than skip, the parallel tests
      # more ranks than the runner's cores (a test uses 3)
      OMPI_MCA_rmaps_base_oversubscribe: "1"
    steps:
      - uses: actions/checkout@v4
      - &install
        name: legacy dolfin from the FEniCS PPA, and twoasis
        run: |
          sudo add-apt-repository -y ppa:fenics-packages/fenics
          sudo apt-get update -qq
          # libdolfin-dev, pybind11-dev and g++: dolfin compiles every form at run time;
          # libparmetis-dev: femtools compiles its ParMETIS partitioner the same way.
          # gmsh, meshio and meshtools (with scipy, skimage and meshpy): the SimplePore2D
          # mesh. h5py: the checkpoint tests; python3-h5py is the wrapper that makes
          # `import h5py` load the MPI build.
          sudo apt-get install -y --no-install-recommends \
            python3-dolfin python3-mpi4py python3-h5py python3-h5py-mpi python3-matplotlib \
            python3-gmsh python3-meshio python3-pytest python3-pip \
            python3-scipy python3-skimage \
            libdolfin-dev libparmetis-dev pybind11-dev g++ pkg-config
          # --no-deps throughout: a pip numpy or mpi4py would not be the one dolfin uses.
          python3 -m pip install --break-system-packages --no-deps meshpy \
            git+https://github.com/gautelinga/femtools.git@2026.2.2 \
            git+https://github.com/gautelinga/partractools.git@2026.2.1 \
            git+https://github.com/gautelinga/meshtools.git@2026.2.0
          python3 -m pip install --break-system-packages --no-deps .
      - &check
        name: the interpreter has everything the tests need
        run: |
          command -v twoasis
          python3 -c "import dolfin, h5py, gmsh, meshio, matplotlib, twoasis; h5py.File; print(dolfin.__version__)"
          python3 -c "import femtools.periodic, femtools.xdmf, partractools.case, meshtools.io"
      # dijitso keys by a hash of the generated code, so a stale entry is a miss,
      # not a wrong answer. A cold cache pays for every form in the suite.
      - &cache
        name: JIT cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/dijitso
          key: dijitso-${{ runner.os }}-${{ hashFiles('twoasis/**/*.py') }}
          restore-keys: dijitso-${{ runner.os }}-
      - name: fast tests
        working-directory: tests
        run: python3 -m pytest -v -rs --durations=10

  slow:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: "1"
      TWOASIS_REQUIRE_MPI: "1"
      OMPI_MCA_rmaps_base_oversubscribe: "1"
    steps:
      - uses: actions/checkout@v4
      - *install
      - *check
      - *cache
      - name: slow tests
        working-directory: tests
        run: python3 -m pytest -m slow -v -rs --durations=10
