name: tests

# Legacy dolfin 2019.2 and DOLFINx 0.11 from the FEniCS PPA, installed with apt on the
# Ubuntu 24.04 runner -- the same setup as the development machine and as
# stokes-beadpack's CI. The suite runs on dolfin (the default backend); a second step
# runs the tests of the problems and solvers the DOLFINx backend supports on DOLFINx
# (TWOASIS_BACKEND=dolfinx), and the cross-backend tests run in both jobs' suites.
# Everything else comes from apt too, so h5py uses dolfin's (parallel) HDF5, NumPy
# is the one dolfin was built against, and mpirun is Ubuntu's Open MPI.
#
# The fast tests run on every push and pull request. The slow tests (temporal
# convergence, a smoke run of every problem) run weekly and on demand from the
# Actions tab.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

# The tests that run on the DOLFINx backend: every problem, solver and option, but not
# dolfin's old bare-vector checkpoints, which restart on dolfin alone.
env:
  DOLFINX_FILES: >-
    test_laplace.py test_rayleigh_taylor.py test_convergence.py test_TPfracStep.py
    test_options.py test_problems.py test_open_boundary.py
  DOLFINX_SKIP: not bare_vectors

# A new push or PR update cancels the previous run of the same kind; the weekly
# and manual (slow) runs are in their own group, so a push does not cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "1"
      TWOASIS_REQUIRE_MPI: "1"  # fail, rather than skip, the parallel tests
      # more ranks than the runner's cores (a test uses 3)
      OMPI_MCA_rmaps_base_oversubscribe: "1"
    steps:
      - uses: actions/checkout@v4
      - &install
        name: legacy dolfin and DOLFINx from the FEniCS PPA, and twoasis
        run: |
          # Launchpad (the PPA's API and archive) is down for minutes at a time, and a
          # download can stall: each attempt gets 15 minutes, a failed index download
          # counts as a failure, and an interrupted install is finished before the next.
          retry() {
            for i in 1 2 3 4 5 6; do
              timeout 900 "$@" && return 0
              echo "attempt $i failed"; sudo dpkg --configure -a || true; sleep 150
            done; return 1; }
          retry sudo add-apt-repository -y -n ppa:fenics-packages/fenics
          retry sudo apt-get update -qq -o APT::Update::Error-Mode=any
          # libdolfin-dev, pybind11-dev and g++: dolfin compiles every form at run time;
          # libparmetis-dev: femtools compiles its ParMETIS partitioner the same way.
          # python3-cppimport: femtools compiles its gradient matrix and probes with it.
          # gmsh, meshio and meshtools (with scipy, skimage and meshpy): the SimplePore2D
          # mesh. h5py: the checkpoint tests; python3-h5py is the wrapper that makes
          # `import h5py` load the MPI build.
          retry sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
            python3-dolfin python3-dolfinx python3-mpi4py python3-h5py python3-h5py-mpi python3-matplotlib \
            python3-gmsh python3-meshio python3-pytest python3-pip \
            python3-scipy python3-skimage python3-cppimport \
            libdolfin-dev libparmetis-dev pybind11-dev g++ pkg-config
          # --no-deps throughout: a pip numpy or mpi4py would not be the one dolfin uses.
          python3 -m pip install --break-system-packages --no-deps meshpy \
            git+https://github.com/gautelinga/femtools.git@696f85bbe45164b854f666239174279eb990c906 \
            git+https://github.com/gautelinga/partractools.git@2026.2.1 \
            git+https://github.com/gautelinga/meshtools.git@2026.2.0
          python3 -m pip install --break-system-packages --no-deps .
      - &check
        name: the interpreter has everything the tests need
        run: |
          command -v twoasis
          python3 -c "import dolfin, h5py, gmsh, meshio, matplotlib, twoasis; h5py.File; print(dolfin.__version__)"
          python3 -c "import cppimport, femtools.periodic, femtools.xdmf, partractools.case, meshtools.io"
          python3 -c "import dolfinx, femtools.dolfinx.unique; print(dolfinx.__version__)"
      # dijitso and FFCx key by a hash of the generated code, so a stale entry is a
      # miss, not a wrong answer. A cold cache pays for every form in the suite.
      - &cache
        name: JIT cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/dijitso
            ~/.cache/fenics
          key: dijitso-${{ runner.os }}-${{ hashFiles('twoasis/**/*.py') }}
          restore-keys: dijitso-${{ runner.os }}-
      - name: fast tests
        working-directory: tests
        run: python3 -m pytest -v -rs --durations=10
      - name: fast tests on DOLFINx
        working-directory: tests
        env:
          TWOASIS_BACKEND: dolfinx
        run: python3 -m pytest -v -rs --durations=10 $DOLFINX_FILES -k "$DOLFINX_SKIP"

  slow:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: "1"
      TWOASIS_REQUIRE_MPI: "1"
      OMPI_MCA_rmaps_base_oversubscribe: "1"
    steps:
      - uses: actions/checkout@v4
      - *install
      - *check
      - *cache
      - name: slow tests
        working-directory: tests
        run: python3 -m pytest -m slow -v -rs --durations=10
      - name: slow tests on DOLFINx
        working-directory: tests
        env:
          TWOASIS_BACKEND: dolfinx
        run: >-
          python3 -m pytest -m slow -v -rs --durations=10 $DOLFINX_FILES
          -k "$DOLFINX_SKIP and not refinement and not spurious and not hysing"
